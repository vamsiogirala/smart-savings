<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin · Smart Savings</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/admin" class="active">Admin</a>
    </nav>
  </header>

  <div class="card">
    <h2>System Health</h2>
    <div class="kpi-row">
      <div class="kpi"><span>Total Transactions</span><strong>{{ stats.total_transactions }}</strong></div>
      <div class="kpi"><span>Distinct Categories</span><strong>{{ stats.distinct_categories }}</strong></div>
      <div class="kpi"><span>Uptime (seconds)</span><strong>{{ stats.uptime_seconds }}</strong></div>
    </div>
  </div>

  <div class="card">
    <h3>Top Categories</h3>
    <canvas id="adminPie"></canvas>
  </div>

  <footer>Smart Savings © 2025 — Admin</footer>

  <script>
    const categories = {{ categories|tojson }};
    const ctx = document.getElementById('adminPie');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(categories),
        datasets: [{
          data: Object.values(categories),
          backgroundColor: ['#1e3a8a','#3b82f6','#60a5fa','#93c5fd','#bfdbfe','#a5b4fc']
        }]
      },
      options: { responsive: true }
    });
  </script>
</body>
</html>
